<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InterMUN UAGRM | Modelo de Naciones Unidas</title>
<meta name="description" content="Portal accesible de InterMUN, el Modelo de Naciones Unidas de la Carrera de Relaciones Internacionales de la UAGRM. Reglas de procedimiento, guía del delegado y credencial digital.">
<meta name="theme-color" content="#040635">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/estilos.css">
<link rel="apple-touch-icon" href="img/icono-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icono-512.png">

<script>
/* Las preferencias de accesibilidad se aplican ANTES del primer pintado,
   para que la persona nunca vea un destello con el tamano o el contraste
   equivocado. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('intermun_accesibilidad') || '{}');
    var h = document.documentElement;
    if (p.escala) h.style.setProperty('--escala-texto', p.escala);
    h.setAttribute('data-tema', p.tema || 'claro');
    h.setAttribute('data-espaciado', p.espaciado ? 'amplio' : 'normal');
    h.setAttribute('data-perfil', p.perfil || 'ninguno');
  } catch (e) {}
}());
</script>
</head>

<body>

<!-- Enlaces de salto: primeros del documento, invisibles hasta recibir foco -->
<a class="saltar" href="#contenido">Saltar al contenido principal</a>
<a class="saltar" href="#navegacion">Saltar a la navegación</a>
<a class="saltar" href="#barra-accesibilidad">Saltar a las herramientas de accesibilidad</a>

<!-- Herramientas de accesibilidad: lo primero que encuentra el lector.
     Es un landmark propio para poder saltar directo a el navegando por
     regiones, sin recorrer toda la página. -->
<section id="barra-accesibilidad" aria-label="Herramientas de accesibilidad"></section>

<header class="barra">
  <div class="barra-inner">
    <a class="marca" href="#/">
      <!-- Logotipo oficial. El alt va vacio a propósito: el texto de al
           lado ya nombra el enlace, y repetirlo obligaria al lector de
           pantalla a decir "InterMUN InterMUN". -->
      <img class="marca-logo" src="img/logo-240.png" alt="" width="54" height="54">
      <span>
        <span class="marca-nom" id="marcaNombre">InterMUN</span>
        <span class="marca-sub">Modelo de Naciones Unidas, UAGRM</span>
      </span>
    </a>
    <span class="barra-sp"></span>
    <span class="sesion-chip oculto" id="chipSesion"></span>
    <button type="button" class="btn-salir" id="btnSalir" hidden>Cerrar sesión</button>
  </div>

  <nav class="nav" aria-label="Navegación principal">
    <div class="nav-inner" id="navegacion"></div>
  </nav>
</header>

<!-- Regiones de anuncio para lectores de pantalla.
     Si algo cambia y no se anuncia aquí, para una persona ciega no paso. -->
<p id="anuncio-vivo" class="solo-lector" role="status" aria-live="polite" aria-atomic="true"></p>
<p id="anuncio-alerta" class="solo-lector" role="alert" aria-live="assertive" aria-atomic="true"></p>

<main class="envoltura" id="contenido" tabindex="-1">
  <h1>Cargando InterMUN</h1>
  <p>Un momento, por favor.</p>
</main>

<section class="instalar-pwa" id="seccion-instalar"></section>

<footer class="pie" id="pie"></footer>

<!-- Aviso visual breve. Su versión hablada va por la región de anuncios,
     así que se oculta al lector de pantalla para no repetir el mensaje. -->
<div id="tostada" class="oculto" aria-hidden="true"></div>

<!-- Librerias servidas desde el propio sitio -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/vendor/qrcode-generator.js"></script>

<!-- Configuración y contenido -->
<script src="js/config.js"></script>
<script src="js/contenido.js"></script>

<!-- Accesibilidad -->
<script src="js/middleware.js"></script>
<script src="js/a11y.js"></script>
<script src="js/voz.js"></script>
<script src="js/instalar.js"></script>

<!-- Nucleo de la aplicación -->
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/vistas-publicas.js"></script>
<script src="js/vistas-admin.js"></script>
<script src="js/identidad.js"></script>
<script src="js/interbot.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>

</body>
</html>
